<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEO Master Guide Database</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-color: #38bdf8;
            --accent-hover: #0284c7;
            --border-color: #334155;
            --danger-color: #ef4444;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }

        .container { max-width: 1400px; margin: 0 auto; }
        
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
        }

        h1 { margin: 0; color: var(--accent-color); font-size: 2rem; }
        
        .user-status { display: flex; align-items: center; gap: 12px; }

        .role-badge {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        .role-owner { background-color: #f59e0b; color: #000; }
        .role-editor { background-color: #38bdf8; color: #000; }
        .role-viewer { background-color: #64748b; color: #fff; }

        .btn {
            background-color: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        .btn:hover { border-color: var(--accent-color); color: var(--accent-color); }
        .btn-primary { background-color: var(--accent-color); color: #000; font-weight: bold; }

        .admin-panel {
            background-color: var(--card-bg);
            border: 1px solid var(--accent-color);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 25px;
            display: none;
        }

        .admin-panel.active { display: block; }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }

        input, select, textarea {
            background: #0f172a;
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 10px;
            border-radius: 6px;
            width: 100%;
            box-sizing: border-box;
        }

        .controls { margin-bottom: 20px; }
        .search-bar { width: 100%; padding: 14px 20px; border-radius: 10px; border: 1px solid var(--border-color); background-color: var(--card-bg); color: #fff; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 15px; }
        
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card-actions {
            display: none;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid var(--border-color);
        }

        .is-editor .card-actions { display: flex; }
        .btn-danger { color: var(--danger-color); border-color: var(--danger-color); }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 10px;
            border: 1px solid var(--accent-color);
            width: 320px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div>
            <h1>LEO Master Guide Database</h1>
            <div style="color: var(--text-muted); font-size: 0.85rem;">Public View & Admin Editor Suite</div>
        </div>
        <div class="user-status">
            <span id="roleBadge" class="role-badge role-viewer">Public Viewer</span>
            <button id="authBtn" class="btn" type="button">Editor Login</button>
        </div>
    </header>

    <!-- OWNER CONTROL PANEL -->
    <div id="ownerPanel" class="admin-panel">
        <h3 style="margin-top:0; color: var(--accent-color);">👑 Owner Settings & Key Manager</h3>
        
        <div style="margin-bottom: 20px;">
            <label style="font-size: 0.85rem; color: var(--text-muted);">Change Owner Password:</label>
            <div style="display: flex; gap: 10px; margin-top: 5px;">
                <input type="password" id="newOwnerPass" placeholder="Enter new Owner Password" style="max-width: 350px;">
                <button class="btn btn-primary" id="updateOwnerPassBtn" type="button">Update Password</button>
            </div>
        </div>

        <hr style="border-color: var(--border-color); margin: 15px 0;">

        <label style="font-size: 0.85rem; color: var(--text-muted);">Add Editor Access Keys:</label>
        <div style="display: flex; gap: 10px; margin-top: 5px;">
            <input type="text" id="newEditorKey" placeholder="Enter new Editor Passcode" style="max-width: 350px;">
            <button class="btn btn-primary" id="addKeyBtn" type="button">Grant Permission Key</button>
        </div>
        
        <div style="margin-top: 15px;">
            <strong>Active Permission Keys:</strong>
            <ul id="keyList" style="font-size: 0.85rem; color: var(--text-muted); margin-top: 5px;"></ul>
        </div>
    </div>

    <!-- ADD ENTRY PANEL -->
    <div id="editorPanel" class="admin-panel">
        <h3 style="margin-top:0; color: var(--accent-color);">✏️ Add New Code Entry</h3>
        <div class="form-grid">
            <input type="text" id="addCode" placeholder="Code (e.g., PC 2.1.1 or TC 1.2)">
            <input type="text" id="addCrime" placeholder="Offense Title">
            <input type="text" id="addFine" placeholder="Fine (e.g., $20,000)">
            <input type="text" id="addStars" placeholder="Stars (e.g., ⭐⭐)">
            <select id="addCategory">
                <option value="Article 2">Article 2: Society</option>
                <option value="Article 3">Article 3: State</option>
                <option value="Article 4">Article 4: Malfeasance</option>
                <option value="Article 5">Article 5: Judicial</option>
                <option value="Traffic Code">Traffic Code</option>
            </select>
            <input type="text" id="addNotes" placeholder="Notes (e.g., Revoke License)">
        </div>
        <textarea id="addDesc" placeholder="Full Description..." style="margin-top: 10px;" rows="2"></textarea>
        <div style="display: flex; gap: 10px; margin-top: 10px;">
            <button class="btn btn-primary" id="saveEntryBtn" type="button">Add Entry to Database</button>
            <button class="btn btn-danger" id="resetDataBtn" type="button">Reset to Default Codes</button>
        </div>
    </div>

    <div class="controls">
        <input type="text" id="searchInput" class="search-bar" placeholder="Search entries...">
    </div>

    <div class="grid" id="penalCodeGrid"></div>
</div>

<!-- LOGIN MODAL -->
<div id="loginModal" class="modal-overlay">
    <div class="modal">
        <h3 style="margin-top:0; color: var(--accent-color);">Editor Login Access</h3>
        <p style="font-size: 0.8rem; color: var(--text-muted);">Enter Owner Password or an Editor Key.</p>
        <input type="password" id="passInput" placeholder="Password / Key" style="margin-bottom: 15px;">
        <div style="display: flex; gap: 10px; justify-content: flex-end;">
            <button class="btn" id="cancelLoginBtn" type="button">Cancel</button>
            <button class="btn btn-primary" id="submitLoginBtn" type="button">Login</button>
        </div>
        <div id="loginError" style="color: var(--danger-color); font-size: 0.8rem; margin-top: 10px; display: none;">Invalid Passcode!</div>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
    const fullDefaultData = [
        { id: 1, code: "PC 2.1.1", crime: "Possession of Cocaine in small quantities", fine: "$20,000", stars: "⭐⭐", notes: "Confiscation", desc: "Possession of up to 4 units of cocaine.", category: "Article 2" },
        { id: 2, code: "PC 2.1.2", crime: "Possession of Cocaine in large quantities", fine: "$40,000", stars: "⭐⭐⭐", notes: "Confiscation", desc: "Possession of 5 or more units of cocaine.", category: "Article 2" },
        { id: 3, code: "PC 2.2.1", crime: "Possession of Cannabis in small quantities", fine: "$10,000", stars: "⭐", notes: "Confiscation", desc: "Possession of up to 4 units of cannabis.", category: "Article 2" },
        { id: 4, code: "PC 2.2.2", crime: "Possession of Cannabis in large quantities", fine: "$25,000", stars: "⭐⭐", notes: "Confiscation", desc: "Possession of 5 or more units of cannabis.", category: "Article 2" },
        { id: 5, code: "PC 2.5.1", crime: "Carrying a weapon without a license", fine: "$20,000", stars: "⭐⭐", notes: "Revoke Gun Lic", desc: "Carrying any firearm without a valid weapon license.", category: "Article 2" },
        { id: 6, code: "PC 2.5.2", crime: "Carrying illegal weapons", fine: "$50,000", stars: "⭐⭐⭐⭐", notes: "Confiscation", desc: "Possession of heavy military-grade weapons or explosive devices.", category: "Article 2" },
        { id: 7, code: "PC 3.1.1", crime: "Assault on a Civil Servant", fine: "$30,000", stars: "⭐⭐⭐", notes: "No Bail", desc: "Physical assault directed toward an active emergency responder or officer.", category: "Article 3" },
        { id: 8, code: "PC 3.2.1", crime: "Bribery of an official", fine: "$35,000", stars: "⭐⭐⭐", notes: "Confiscation", desc: "Attempting to bribe any public official or officer.", category: "Article 3" },
        { id: 9, code: "TC 1.1", crime: "Speeding Offense", fine: "$5,000", stars: "", notes: "Traffic Citation", desc: "Exceeding posted speed limits within city boundaries.", category: "Traffic Code" },
        { id: 10, code: "TC 1.2", crime: "Reckless Driving", fine: "$15,000", stars: "⭐", notes: "Vehicle Impound", desc: "Driving dangerously or endangering pedestrians.", category: "Traffic Code" }
    ];

    let database = JSON.parse(localStorage.getItem('leo_db')) || fullDefaultData;
    let currentUserRole = 'VIEWER'; 
    let activeEditorKeys = JSON.parse(localStorage.getItem('editor_keys')) || ['editor123'];
    let ownerPassword = localStorage.getItem('owner_pass') || 'ownerpass';

    function saveDB() {
        localStorage.setItem('leo_db', JSON.stringify(database));
        renderCards();
    }

    function updateRoleUI() {
        const badge = document.getElementById('roleBadge');
        const authBtn = document.getElementById('authBtn');
        const ownerPanel = document.getElementById('ownerPanel');
        const editorPanel = document.getElementById('editorPanel');
        const body = document.body;

        body.classList.remove('is-editor');
        ownerPanel.classList.remove('active');
        editorPanel.classList.remove('active');

        if (currentUserRole === 'OWNER') {
            badge.className = 'role-badge role-owner';
            badge.innerText = 'Owner';
            authBtn.innerText = 'Logout';
            ownerPanel.classList.add('active');
            editorPanel.classList.add('active');
            body.classList.add('is-editor');
            renderKeysList();
        } else if (currentUserRole === 'EDITOR') {
            badge.className = 'role-badge role-editor';
            badge.innerText = 'Editor';
            authBtn.innerText = 'Logout';
            editorPanel.classList.add('active');
            body.classList.add('is-editor');
        } else {
            badge.className = 'role-badge role-viewer';
            badge.innerText = 'Editor Login';
        }
    }

    document.getElementById('authBtn').onclick = function() {
        if (currentUserRole !== 'VIEWER') {
            currentUserRole = 'VIEWER';
            updateRoleUI();
        } else {
            document.getElementById('loginModal').classList.add('active');
            document.getElementById('passInput').value = '';
            document.getElementById('loginError').style.display = 'none';
        }
    };

    document.getElementById('cancelLoginBtn').onclick = function() {
        document.getElementById('loginModal').classList.remove('active');
    };

    document.getElementById('submitLoginBtn').onclick = function() {
        const pass = document.getElementById('passInput').value.trim();
        if (pass === ownerPassword) {
            currentUserRole = 'OWNER';
            document.getElementById('loginModal').classList.remove('active');
            updateRoleUI();
        } else if (activeEditorKeys.includes(pass)) {
            currentUserRole = 'EDITOR';
            document.getElementById('loginModal').classList.remove('active');
            updateRoleUI();
        } else {
            document.getElementById('loginError').style.display = 'block';
        }
    };

    document.getElementById('updateOwnerPassBtn').onclick = function() {
        const newPass = document.getElementById('newOwnerPass').value.trim();
        if (newPass) {
            ownerPassword = newPass;
            localStorage.setItem('owner_pass', newPass);
            document.getElementById('newOwnerPass').value = '';
            alert('Owner password updated successfully!');
        }
    };

    document.getElementById('addKeyBtn').onclick = function() {
        const key = document.getElementById('newEditorKey').value.trim();
        if (key && !activeEditorKeys.includes(key)) {
            activeEditorKeys.push(key);
            localStorage.setItem('editor_keys', JSON.stringify(activeEditorKeys));
            document.getElementById('newEditorKey').value = '';
            renderKeysList();
            alert('Editor Key Added!');
        }
    };

    document.getElementById('resetDataBtn').onclick = function() {
        if (confirm("Reset database back to default penal codes? Custom entries will be removed.")) {
            database = fullDefaultData;
            saveDB();
        }
    };

    function renderKeysList() {
        const list = document.getElementById('keyList');
        list.innerHTML = activeEditorKeys.map(k => `<li>Key: <code>${k}</code></li>`).join('');
    }

    document.getElementById('saveEntryBtn').onclick = function() {
        const code = document.getElementById('addCode').value;
        const crime = document.getElementById('addCrime').value;
        const fine = document.getElementById('addFine').value;
        const stars = document.getElementById('addStars').value;
        const category = document.getElementById('addCategory').value;
        const notes = document.getElementById('addNotes').value;
        const desc = document.getElementById('addDesc').value;

        if (!code || !crime) {
            alert("Please enter a Code and Title.");
            return;
        }

        database.push({ id: Date.now(), code, crime, fine, stars, category, notes, desc });
        saveDB();
        
        document.getElementById('addCode').value = '';
        document.getElementById('addCrime').value = '';
        document.getElementById('addFine').value = '';
        document.getElementById('addStars').value = '';
        document.getElementById('addNotes').value = '';
        document.getElementById('addDesc').value = '';
    };

    window.deleteEntry = function(id) {
        if (confirm("Delete this entry?")) {
            database = database.filter(item => item.id !== id);
            saveDB();
        }
    };

    function renderCards() {
        const grid = document.getElementById('penalCodeGrid');
        const query = document.getElementById('searchInput').value.toLowerCase();
        grid.innerHTML = '';

        const filtered = database.filter(item => 
            item.code.toLowerCase().includes(query) || 
            item.crime.toLowerCase().includes(query) || 
            item.desc.toLowerCase().includes(query)
        );

        filtered.forEach(item => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div>
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <strong style="color:var(--accent-color);">${item.code}</strong>
                        <span style="color:#f59e0b; font-size:0.9rem;">${item.stars || ''}</span>
                        <span style="color:#4ade80; font-weight:bold;">${item.fine}</span>
                    </div>
                    <h4 style="margin:8px 0;">${item.crime}</h4>
                    <p style="font-size:0.85rem; color:var(--text-muted);">${item.desc}</p>
                    ${item.notes ? `<div style="font-size:0.75rem; color:#f87171; margin-top:5px;">Note: ${item.notes}</div>` : ''}
                </div>
                <div class="card-actions">
                    <button class="btn btn-danger" style="width:100%;" onclick="deleteEntry(${item.id})">Delete Entry</button>
                </div>
            `;
            grid.appendChild(card);
        });
    }

    document.getElementById('searchInput').oninput = renderCards;
    renderCards();
});
</script>
</body>
</html>
