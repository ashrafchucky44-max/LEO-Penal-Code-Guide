<html lang="en">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        leoDark: '#0B0F19',
                        leoCard: '#111827',
                        leoBorder: '#1F2937',
                        leoAccent: '#3B82F6',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-leoDark text-gray-200 min-h-screen font-sans flex flex-col">

    <!-- Header -->
    <header class="bg-gray-900 border-b border-leoBorder sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <i class="fa-solid font-bold fa-shield-halved text-blue-500 text-3xl"></i>
                <div>
                    <h1 class="text-xl font-bold text-white tracking-wide">LEO PENAL CODE GUIDE</h1>
                    <p class="text-xs text-gray-400">Department of Justice Official Reference</p>
                </div>
            </div>
            
            <!-- Quick Search Bar -->
            <div class="relative w-full md:w-96">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                <input type="text" id="searchInput" oninput="filterData()" placeholder="Search code, crime name, notes..." 
                    class="w-full bg-gray-800 text-sm text-white pl-10 pr-4 py-2 rounded-lg border border-gray-700 focus:outline-none focus:border-blue-500">
            </div>
        </div>
    </header>

    <!-- Main Content Grid -->
    <main class="max-w-7xl mx-auto px-4 py-6 grid grid-cols-1 lg:grid-cols-3 gap-6 flex-grow w-full">
        
        <!-- Left 2 Columns: Database View -->
        <section class="lg:col-span-2 space-y-4">
            
            <!-- Filter Controls -->
            <div class="bg-leoCard p-4 rounded-lg border border-leoBorder flex flex-wrap gap-2 items-center">
                <span class="text-xs font-semibold text-gray-400 uppercase tracking-wider mr-2">Article Filter:</span>
                <button onclick="setFilter('ALL')" class="filter-btn text-xs px-3 py-1.5 rounded-md font-medium bg-blue-600 text-white">All</button>
                <button onclick="setFilter('ART2')" class="filter-btn text-xs px-3 py-1.5 rounded-md font-medium bg-gray-800 text-gray-300 hover:bg-gray-700">Art 2: Society</button>
                <button onclick="setFilter('ART3')" class="filter-btn text-xs px-3 py-1.5 rounded-md font-medium bg-gray-800 text-gray-300 hover:bg-gray-700">Art 3: State</button>
                <button onclick="setFilter('ART4')" class="filter-btn text-xs px-3 py-1.5 rounded-md font-medium bg-gray-800 text-gray-300 hover:bg-gray-700">Art 4: Malfeasance</button>
                <button onclick="setFilter('ART5')" class="filter-btn text-xs px-3 py-1.5 rounded-md font-medium bg-gray-800 text-gray-300 hover:bg-gray-700">Art 5: Judicial</button>
            </div>

            <!-- Penal Code Table Container -->
            <div class="bg-leoCard rounded-lg border border-leoBorder overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm">
                        <thead class="bg-gray-900 border-b border-leoBorder text-xs text-gray-400 uppercase">
                            <tr>
                                <th class="p-3">Action</th>
                                <th class="p-3">Code</th>
                                <th class="p-3">Offense / Description</th>
                                <th class="p-3">Fine</th>
                                <th class="p-3">Notes</th>
                            </tr>
                        </thead>
                        <tbody id="penalTableBody" class="divide-y divide-gray-800">
                            <!-- Dynamic Content Rendered via JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </section>

        <!-- Right 1 Column: Active Arrest / Fine Aggregator Sidebar -->
        <section class="lg:col-span-1">
            <div class="bg-leoCard p-4 rounded-lg border border-leoBorder sticky top-24 space-y-4">
                <div class="flex justify-between items-center border-b border-gray-800 pb-3">
                    <h2 class="text-base font-bold text-white flex items-center gap-2">
                        <i class="fa-solid fa-calculator text-blue-500"></i> Arrest Sheet Calculator
                    </h2>
                    <button onclick="clearBasket()" class="text-xs text-red-400 hover:text-red-300">Clear All</button>
                </div>

                <div id="basketItems" class="space-y-2 max-h-64 overflow-y-auto pr-1">
                    <p class="text-xs text-gray-500 text-center py-4">No charges selected. Click "+" on any penal item to add.</p>
                </div>

                <div class="border-t border-gray-800 pt-3 space-y-2">
                    <div class="flex justify-between text-sm font-semibold text-gray-300">
                        <span>Total Fine:</span>
                        <span id="totalFine" class="text-green-400 text-lg">$0</span>
                    </div>
                    <div class="flex justify-between text-xs text-gray-400">
                        <span>Bail Status:</span>
                        <span id="bailStatus" class="font-bold text-green-500">ELGIBLE FOR BAIL</span>
                    </div>
                    <div id="specialNotes" class="hidden text-xs bg-yellow-900/30 border border-yellow-700 text-yellow-300 p-2 rounded">
                        <!-- Special conditions show up here -->
                    </div>
                </div>

                <button onclick="window.print()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium text-xs py-2.5 rounded-md transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-print"></i> Export / Print Case Details
                </button>
            </div>
        </section>

    </main>

            { code: "PC 4.4", crime: "Espionage", fine: 75000, notes: "None", desc: "Spying on person/company/government.", art: "ART4" },
            { code: "PC 4.5", crime: "Conduct Unbecoming", fine: 75000, notes: "None", desc: "Acting against public interest harming standing.", art: "ART4" },
            { code: "PC 4.6", crime: "Corruption", fine: 75000, notes: "None", desc: "Dishonest/fraudulent behavior by state employee.", art: "ART4" },

            // ARTICLE 5
            { code: "PC 5.1", crime: "Disobeying Judicial Order", fine: 20000, notes: "No Bail", desc: "Failing to follow Governor/AG/Judge order.", art: "ART5" },
            { code: "PC 5.2", crime: "Disruption of a Trial", fine: 20000, notes: "No Bail", desc: "Disrupting legal processes in court.", art: "ART5" },
            { code: "PC 5.3", crime: "Dishonoring Judiciary Member", fine: 20000, notes: "No Bail", desc: "Dishonoring judicial officer performance.", art: "ART5" },
            { code: "PC 5.4", crime: "Contempt of Court", fine: 20000, notes: "No Bail", desc: "Being disobedient in court.", art: "ART5" },
            { code: "PC 5.5", crime: "Misuse of Judiciary Permit", fine: 20000, notes: "No Bail", desc: "Misuse of a judicial permit.", art: "ART5" },
            { code: "PC 5.6", crime: "Forged Evidence", fine: 20000, notes: "No Bail", desc: "Tampering or forging evidence.", art: "ART5" },
            { code: "PC 5.7", crime: "Perjury", fine: 20000, notes: "No Bail", desc: "Swearing false oath in official proceedings.", art: "ART5" }
        ];

        let currentFilter = 'ALL';
        let selectedCharges = [];

        function renderTable() {
            const tbody = document.getElementById('penalTableBody');
            const searchVal = document.getElementById('searchInput').value.toLowerCase();
            tbody.innerHTML = '';

            const filtered = penalData.filter(item => {
                const matchesFilter = (currentFilter === 'ALL' || item.art === currentFilter);
                const matchesSearch = item.code.toLowerCase().includes(searchVal) || 
                                      item.crime.toLowerCase().includes(searchVal) ||
                                      item.desc.toLowerCase().includes(searchVal) ||
                                      item.notes.toLowerCase().includes(searchVal);
                return matchesFilter && matchesSearch;
            });

            filtered.forEach(item => {
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-gray-800/50 transition';
                
                const isNoBail = item.notes.toLowerCase().includes('no bail');

                tr.innerHTML = `
                    <td class="p-3">
                        <button onclick='addCharge("${item.code}")' class="bg-blue-600/20 text-blue-400 hover:bg-blue-600 hover:text-white px-2 py-1 rounded transition text-xs font-bold">
                            <i class="fa-solid fa-plus"></i>
                        </button>
                    </td>
                    <td class="p-3 font-mono font-bold text-blue-400 whitespace-nowrap">${item.code}</td>
                    <td class="p-3">
                        <div class="font-semibold text-gray-100">${item.crime}</div>
                        <div class="text-xs text-gray-400">${item.desc}</div>
                    </td>
                    <td class="p-3 font-semibold text-green-400 whitespace-nowrap">$${item.fine.toLocaleString()}</td>
                    <td class="p-3 text-xs whitespace-nowrap">
                        <span class="px-2 py-0.5 rounded ${isNoBail ? 'bg-red-900/40 text-red-400 border border-red-700' : 'bg-gray-800 text-gray-300'}">
                            ${item.notes}
                        </span>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function setFilter(filter) {
            currentFilter = filter;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.className = 'filter-btn text-xs px-3 py-1.5 rounded-md font-medium bg-gray-800 text-gray-300 hover:bg-gray-700';
            });
            event.target.className = 'filter-btn text-xs px-3 py-1.5 rounded-md font-medium bg-blue-600 text-white';
            renderTable();
        }

        function filterData() {
            renderTable();
        }

        function addCharge(code) {
            const item = penalData.find(i => i.code === code);
            if(item) {
                selectedCharges.push(item);
                updateBasket();
            }
        }

        function removeCharge(index) {
            selectedCharges.splice(index, 1);
            updateBasket();
        }

        function clearBasket() {
            selectedCharges = [];
            updateBasket();
        }

        function updateBasket() {
            const container = document.getElementById('basketItems');
            const totalFineEl = document.getElementById('totalFine');
            const bailStatusEl = document.getElementById('bailStatus');
            const specialNotesEl = document.getElementById('specialNotes');

            if (selectedCharges.length === 0) {
                container.innerHTML = `<p class="text-xs text-gray-500 text-center py-4">No charges selected. Click "+" on any penal item to add.</p>`;
                totalFineEl.textContent = '$0';
                bailStatusEl.textContent = 'ELIGIBLE FOR BAIL';
                bailStatusEl.className = 'font-bold text-green-500';
                specialNotesEl.classList.add('hidden');
                return;
            }

            container.innerHTML = '';
            let total = 0;
            let hasNoBail = false;
            let specialNotes = [];

            selectedCharges.forEach((item, index) => {
                total += item.fine;
                if(item.notes.toLowerCase().includes('no bail')) hasNoBail = true;
                if(item.notes !== 'None' && !item.notes.toLowerCase().includes('no bail')) {
                    specialNotes.push(`${item.code}: ${item.notes}`);
                }

                const div = document.createElement('div');
                div.className = 'flex justify-between items-center bg-gray-900 p-2 rounded border border-gray-800 text-xs';
                div.innerHTML = `
                    <div>
                        <div class="font-bold text-blue-400">${item.code} - ${item.crime}</div>
                        <div class="text-green-400">$${item.fine.toLocaleString()}</div>
                    </div>
                    <button onclick="removeCharge(${index})" class="text-red-400 hover:text-red-300 px-1">
                        <i class="fa-solid fa-trash"></i>
                    </button>
                `;
                container.appendChild(div);
            });

            totalFineEl.textContent = `$${total.toLocaleString()}`;

            if(hasNoBail) {
                bailStatusEl.textContent = 'NO BAIL ALLOWED';
                bailStatusEl.className = 'font-bold text-red-500';
            } else {
                bailStatusEl.textContent = 'ELIGIBLE FOR BAIL';
                bailStatusEl.className = 'font-bold text-green-500';
            }

            if(specialNotes.length > 0) {
                specialNotesEl.classList.remove('hidden');
                specialNotesEl.innerHTML = `<strong>Action Required:</strong><br>` + [...new Set(specialNotes)].join('<br>');
            } else {
                specialNotesEl.classList.add('hidden');
            }
        }

        // Initial Initialization
        renderTable();
    </script>
</body>
</html>
