<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UT Penal Code Guide</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-color: #38bdf8;
            --accent-hover: #0284c7;
            --border-color: #334155;
            --danger-color: #ef4444;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
        }

        h1 {
            margin: 0;
            color: var(--accent-color);
        }

        .user-status {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .role-badge {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        .role-owner { background-color: #f59e0b; color: #000; }
        .role-editor { background-color: #38bdf8; color: #000; }
        .role-viewer { background-color: #64748b; color: #fff; }

        .btn {
            background-color: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }

        .btn:hover {
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        .btn-primary {
            background-color: var(--accent-color);
            color: #000;
            border: none;
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
            color: #fff;
        }

        .btn-danger {
            color: var(--danger-color);
            border-color: var(--danger-color);
        }

        .btn-sm {
            padding: 4px 8px;
            font-size: 0.75rem;
        }

        .admin-panel {
            background-color: var(--card-bg);
            border: 1px solid var(--accent-color);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            display: none;
        }

        .admin-panel.active {
            display: block;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .search-bar {
            flex-grow: 1;
            padding: 10px 15px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background-color: var(--card-bg);
            color: #fff;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }

        .card-code {
            font-weight: bold;
            color: var(--accent-color);
        }

        .card-fine {
            color: #4ade80;
            font-weight: bold;
        }

        .card-title {
            font-size: 1.1rem;
            margin: 0 0 10px 0;
        }

        .card-desc {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 15px;
        }

        .card-actions {
            display: none;
            gap: 10px;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid var(--border-color);
        }

        .is-editor .card-actions {
            display: flex;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            width: 300px;
        }

        .key-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0f172a;
            padding: 6px 12px;
            border-radius: 6px;
            margin-top: 5px;
            border: 1px solid var(--border-color);
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div>
            <h1>UT Penal Code Guide</h1>
            <div style="color: var(--text-muted); font-size: 0.85rem;">Official Law Enforcement Reference</div>
        </div>
        <div class="user-status">
            <span id="roleBadge" class="role-badge role-viewer">Viewer</span>
            <button id="authBtn" class="btn" type="button">Login</button>
        </div>
    </header>

    <!-- OWNER CONTROL PANEL -->
    <div id="ownerPanel" class="admin-panel">
        <h3 style="margin-top:0; color: var(--accent-color);">👑 Owner Control Panel</h3>
        
        <div style="margin-bottom: 15px;">
            <label style="font-size: 0.85rem; color: var(--text-muted);">Change Owner Password:</label>
            <div style="display: flex; gap: 10px; margin-top: 5px;">
                <input type="password" id="newOwnerPass" placeholder="New Owner Password" style="max-width: 300px; padding: 8px; border-radius: 6px; border: 1px solid var(--border-color); background: #0f172a; color: #fff;">
                <button class="btn btn-primary" id="updateOwnerPassBtn" type="button">Update Password</button>
            </div>
        </div>

        <hr style="border-color: var(--border-color); margin: 15px 0;">

        <label style="font-size: 0.85rem; color: var(--text-muted);">Manage Editor Keys:</label>
        <div style="display: flex; gap: 10px; margin-top: 5px; margin-bottom: 10px;">
            <input type="text" id="newEditorKey" placeholder="Create Editor Key" style="max-width: 300px; padding: 8px; border-radius: 6px; border: 1px solid var(--border-color); background: #0f172a; color: #fff;">
            <button class="btn btn-primary" id="addKeyBtn" type="button">Add Key</button>
        </div>
        
        <div>
            <strong>Active Keys:</strong>
            <div id="keyList" style="max-width: 400px; margin-top: 5px;"></div>
        </div>
    </div>

    <!-- ADD ENTRY PANEL -->
    <div id="editorPanel" class="admin-panel">
        <h3 style="margin-top:0; color: var(--accent-color);">Add / Manage Penal Code</h3>
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-bottom: 10px;">
            <input type="text" id="addCode" placeholder="Code (e.g. PC 2.1.1)" style="padding: 8px; border-radius: 6px; border: 1px solid var(--border-color); background: #0f172a; color: #fff;">
            <input type="text" id="addCrime" placeholder="Title / Offense" style="padding: 8px; border-radius: 6px; border: 1px solid var(--border-color); background: #0f172a; color: #fff;">
            <input type="text" id="addFine" placeholder="Fine (e.g. $20,000)" style="padding: 8px; border-radius: 6px; border: 1px solid var(--border-color); background: #0f172a; color: #fff;">
            <input type="text" id="addStars" placeholder="Stars (e.g. ⭐⭐)" style="padding: 8px; border-radius: 6px; border: 1px solid var(--border-color); background: #0f172a; color: #fff;">
        </div>
        <textarea id="addDesc" placeholder="Description & Notes..." style="width: 100%; box-sizing: border-box; padding: 8px; border-radius: 6px; border: 1px solid var(--border-color); background: #0f172a; color: #fff; margin-bottom: 10px;" rows="2"></textarea>
        <button class="btn btn-primary" id="saveEntryBtn" type="button">Save Entry</button>
    </div>

    <div class="controls">
        <input type="text" id="searchInput" class="search-bar" placeholder="Search by code, title, or description...">
    </div>

    <div class="grid" id="penalCodeGrid"></div>
</div>

<!-- LOGIN MODAL -->
<div id="loginModal" class="modal-overlay">
    <div class="modal">
        <h3 style="margin-top:0; color: var(--accent-color);">Access Authentication</h3>
        <p style="font-size: 0.85rem; color: var(--text-muted);">Enter Owner Password or Editor Passcode.</p>
        <input type="password" id="passInput" placeholder="Password / Key" style="width: 100%; box-sizing: border-box; padding: 8px; margin-bottom: 15px; border-radius: 6px; border: 1px solid var(--border-color); background: #0f172a; color: #fff;">
        <div style="display: flex; gap: 10px; justify-content: flex-end;">
            <button class="btn" id="cancelLoginBtn" type="button">Cancel</button>
            <button class="btn btn-primary" id="submitLoginBtn" type="button">Login</button>
        </div>
        <div id="loginError" style="color: var(--danger-color); font-size: 0.8rem; margin-top: 10px; display: none;">Invalid credentials!</div>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
    // Initial Code Database
    const initialCodes = [
        { id: 1, code: "PC 2.1.1", crime: "Possession of Cocaine in small quantities", fine: "$20,000", stars: "⭐⭐", desc: "Possession of up to 4 units of cocaine. Note: Confiscation" },
        { id: 2, code: "PC 2.1.2", crime: "Possession of Cocaine in large quantities", fine: "$40,000", stars: "⭐⭐⭐", desc: "Possession of 5 or more units of cocaine. Note: Confiscation" },
        { id: 3, code: "PC 2.2.1", crime: "Possession of Cannabis in small quantities", fine: "$10,000", stars: "⭐", desc: "Possession of up to 4 units of cannabis. Note: Confiscation" },
        { id: 4, code: "PC 2.2.2", crime: "Possession of Cannabis in large quantities", fine: "$25,000", stars: "⭐⭐", desc: "Possession of 5 or more units of cannabis. Note: Confiscation" },
        { id: 5, code: "PC 2.5.1", crime: "Carrying a weapon without a license", fine: "$20,000", stars: "⭐⭐", desc: "Carrying any firearm without a valid weapon license. Note: Revoke Gun Lic" },
        { id: 6, code: "PC 2.5.2", crime: "Carrying illegal weapons", fine: "$50,000", stars: "⭐⭐⭐⭐", desc: "Possession of heavy military-grade weapons or explosive devices. Note: Confiscation" },
        { id: 7, code: "PC 3.1.1", crime: "Assault on a Civil Servant", fine: "$30,000", stars: "⭐⭐⭐", desc: "Physical assault directed toward an active emergency responder or officer. Note: No Bail" },
        { id: 8, code: "PC 3.2.1", crime: "Bribery of an official", fine: "$35,000", stars: "⭐⭐⭐", desc: "Attempting to bribe any public official or officer. Note: Confiscation" },
        { id: 9, code: "TC 1.1", crime: "Speeding Offense", fine: "$5,000", stars: "", desc: "Exceeding posted speed limits within city boundaries. Note: Traffic Citation" },
        { id: 10, code: "TC 1.2", crime: "Reckless Driving", fine: "$15,000", stars: "⭐", desc: "Driving dangerously or endangering pedestrians. Note: Vehicle Impound" }
    ];

    let database = JSON.parse(localStorage.getItem('ut_leo_db')) || initialCodes;
    let currentUserRole = 'VIEWER'; 
    let activeEditorKeys = JSON.parse(localStorage.getItem('editor_keys')) || ['editor123'];
    let ownerPassword = localStorage.getItem('owner_pass') || 'ownerpass';

    function saveDB() {
        localStorage.setItem('ut_leo_db', JSON.stringify(database));
        renderCards();
    }

    function updateRoleUI() {
        const badge = document.getElementById('roleBadge');
        const authBtn = document.getElementById('authBtn');
        const ownerPanel = document.getElementById('ownerPanel');
        const editorPanel = document.getElementById('editorPanel');
        const body = document.body;

        body.classList.remove('is-editor');
        ownerPanel.classList.remove('active');
        editorPanel.classList.remove('active');

        if (currentUserRole === 'OWNER') {
            badge.className = 'role-badge role-owner';
            badge.innerText = 'Owner';
            authBtn.innerText = 'Logout';
            ownerPanel.classList.add('active');
            editorPanel.classList.add('active');
            body.classList.add('is-editor');
            renderKeysList();
        } else if (currentUserRole === 'EDITOR') {
            badge.className = 'role-badge role-editor';
            badge.innerText = 'Editor';
            authBtn.innerText = 'Logout';
            editorPanel.classList.add('active');
            body.classList.add('is-editor');
        } else {
            badge.className = 'role-badge role-viewer';
            badge.innerText = 'Login';
        }
    }

    document.getElementById('authBtn').onclick = function() {
        if (currentUserRole !== 'VIEWER') {
            currentUserRole = 'VIEWER';
            updateRoleUI();
        } else {
            document.getElementById('loginModal').classList.add('active');
            document.getElementById('passInput').value = '';
            document.getElementById('loginError').style.display = 'none';
        }
    };

    document.getElementById('cancelLoginBtn').onclick = function() {
        document.getElementById('loginModal').classList.remove('active');
    };

    document.getElementById('submitLoginBtn').onclick = function() {
        const pass = document.getElementById('passInput').value.trim();
        if (pass === ownerPassword) {
            currentUserRole = 'OWNER';
            document.getElementById('loginModal').classList.remove('active');
            updateRoleUI();
        } else if (activeEditorKeys.includes(pass)) {
            currentUserRole = 'EDITOR';
            document.getElementById('loginModal').classList.remove('active');
            updateRoleUI();
        } else {
            document.getElementById('loginError').style.display = 'block';
        }
    };

    document.getElementById('updateOwnerPassBtn').onclick = function() {
        const newPass = document.getElementById('newOwnerPass').value.trim();
        if (newPass) {
            ownerPassword = newPass;
            localStorage.setItem('owner_pass', newPass);
            document.getElementById('newOwnerPass').value = '';
            alert('Owner password updated!');
        }
    };

    document.getElementById('addKeyBtn').onclick = function() {
        const key = document.getElementById('newEditorKey').value.trim();
        if (key && !activeEditorKeys.includes(key)) {
            activeEditorKeys.push(key);
            localStorage.setItem('editor_keys', JSON.stringify(activeEditorKeys));
            document.getElementById('newEditorKey').value = '';
            renderKeysList();
        }
    };

    window.revokeKey = function(keyToRemove) {
        if (confirm(`Revoke key "${keyToRemove}"?`)) {
            activeEditorKeys = activeEditorKeys.filter(k => k !== keyToRemove);
            localStorage.setItem('editor_keys', JSON.stringify(activeEditorKeys));
            renderKeysList();
        }
    };

    function renderKeysList() {
        const list = document.getElementById('keyList');
        if (activeEditorKeys.length === 0) {
            list.innerHTML = '<div style="font-size:0.85rem; color:var(--text-muted);">No active editor keys.</div>';
            return;
        }
        list.innerHTML = activeEditorKeys.map(k => `
            <div class="key-item">
                <code style="color:var(--accent-color);">${k}</code>
                <button class="btn btn-danger btn-sm" onclick="revokeKey('${k}')">Revoke</button>
            </div>
        `).join('');
    }

    document.getElementById('saveEntryBtn').onclick = function() {
        const code = document.getElementById('addCode').value;
        const crime = document.getElementById('addCrime').value;
        const fine = document.getElementById('addFine').value;
        const stars = document.getElementById('addStars').value;
        const desc = document.getElementById('addDesc').value;

        if (!code || !crime) {
            alert("Please provide at least a Code and Title.");
            return;
        }

        database.push({ id: Date.now(), code, crime, fine, stars, desc });
        saveDB();
        
        document.getElementById('addCode').value = '';
        document.getElementById('addCrime').value = '';
        document.getElementById('addFine').value = '';
        document.getElementById('addStars').value = '';
        document.getElementById('addDesc').value = '';
    };

    window.deleteEntry = function(id) {
        if (confirm("Delete this entry?")) {
            database = database.filter(item => item.id !== id);
            saveDB();
        }
    };

    function renderCards() {
        const grid = document.getElementById('penalCodeGrid');
        const query = document.getElementById('searchInput').value.toLowerCase();
        grid.innerHTML = '';

        const filtered = database.filter(item => 
            item.code.toLowerCase().includes(query) || 
            item.crime.toLowerCase().includes(query) || 
            item.desc.toLowerCase().includes(query)
        );

        filtered.forEach(item => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div>
                    <div class="card-header">
                        <span class="card-code">${item.code}</span>
                        <span>${item.stars || ''}</span>
                        <span class="card-fine">${item.fine || ''}</span>
                    </div>
                    <h3 class="card-title">${item.crime}</h3>
                    <p class="card-desc">${item.desc}</p>
                </div>
                <div class="card-actions">
                    <button class="btn btn-danger" style="width:100%;" onclick="deleteEntry(${item.id})">Delete Entry</button>
                </div>
            `;
            grid.appendChild(card);
        });
    }

    document.getElementById('searchInput').oninput = renderCards;
    renderCards();
});
</script>
</body>
</html>
