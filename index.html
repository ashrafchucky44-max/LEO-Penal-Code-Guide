    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        leoDark: '#0B0F19',
                        leoCard: '#111827',
                        leoBorder: '#1F2937',
                        leoAccent: '#3B82F6',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-leoDark text-gray-200 min-h-screen font-sans flex flex-col">

    <!-- Header -->
    <header class="bg-gray-900 border-b border-leoBorder sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <i class="fa-solid font-bold fa-shield-halved text-blue-500 text-3xl"></i>
                <div>
                    <h1 class="text-xl font-bold text-white tracking-wide">LEO PENAL CODE GUIDE</h1>
                    <p class="text-xs text-gray-400">Department of Justice Official Reference</p>
                </div>
            </div>
            
            <!-- Quick Search Bar -->
            <div class="relative w-full md:w-96">
                <input type="text" id="searchInput" placeholder="Search by charge, PC code, or keyword..." 
                    class="w-full bg-gray-800 border border-leoBorder text-white text-sm rounded-lg pl-10 pr-4 py-2 focus:outline-none focus:border-blue-500 transition">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-gray-400 text-sm"></i>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-7xl mx-auto px-4 py-6 flex-1 w-full grid grid-cols-1 lg:grid-cols-3 gap-6">

        <!-- Left 2 Columns: Penal Code Guide & Filter Options -->
        <section class="lg:col-span-2 flex flex-col gap-4">
            
            <!-- Filters Header -->
            <div class="bg-leoCard border border-leoBorder p-4 rounded-xl flex flex-wrap items-center justify-between gap-3">
                <div class="flex items-center space-x-2">
                    <i class="fa-solid fa-filter text-blue-400"></i>
                    <span class="text-sm font-semibold text-gray-300">Filter Category:</span>
                </div>
                <div class="flex flex-wrap gap-2 text-xs" id="categoryFilters">
                    <button class="filter-btn active bg-blue-600 text-white px-3 py-1.5 rounded-md transition" data-art="ALL">All</button>
                    <button class="filter-btn bg-gray-800 hover:bg-gray-700 text-gray-300 px-3 py-1.5 rounded-md transition" data-art="ART2">Art 2: Society</button>
                    <button class="filter-btn bg-gray-800 hover:bg-gray-700 text-gray-300 px-3 py-1.5 rounded-md transition" data-art="ART3">Art 3: State</button>
                    <button class="filter-btn bg-gray-800 hover:bg-gray-700 text-gray-300 px-3 py-1.5 rounded-md transition" data-art="ART4">Art 4: Malfeasance</button>
                    <button class="filter-btn bg-gray-800 hover:bg-gray-700 text-gray-300 px-3 py-1.5 rounded-md transition" data-art="ART5">Art 5: Judicial</button>
                </div>
            </div>

            <!-- Law Cards Container -->
            <div id="lawList" class="flex flex-col gap-3">
                <!-- Javascript will inject law cards here dynamically -->
            </div>
        </section>

        <!-- Right 1 Column: Arrest Calculator & Citation Helper -->
        <section class="lg:col-span-1 flex flex-col gap-4">
            
            <div class="bg-leoCard border border-leoBorder rounded-xl p-5 sticky top-20 flex flex-col gap-4 shadow-xl">
                <div class="flex items-center justify-between border-b border-leoBorder pb-3">
                    <div class="flex items-center space-x-2">
                        <i class="fa-solid fa-calculator text-blue-400 text-lg"></i>
                        <h2 class="font-bold text-white text-base tracking-wide">ARREST CALCULATOR</h2>
                    </div>
                    <button id="clearAllBtn" class="text-xs text-red-400 hover:text-red-300 underline font-medium">Clear All</button>
                </div>

                <!-- Selected Charges Summary -->
                <div>
                    <h3 class="text-xs uppercase font-semibold text-gray-400 tracking-wider mb-2">Selected Offences (<span id="chargeCount">0</span>)</h3>
                    <div id="selectedChargesList" class="max-h-48 overflow-y-auto space-y-2 text-xs pr-1">
                        <p class="text-gray-500 italic text-center py-4">No charges added yet. Click "+ Add" on any crime to calculate total fine & wanted level.</p>
                    </div>
                </div>

                <!-- Totals Display -->
                <div class="bg-gray-900 border border-leoBorder rounded-lg p-4 space-y-3">
                    <div class="flex justify-between items-center text-sm">
                        <span class="text-gray-400">Total Wanted Stars:</span>
                        <div id="totalStarsDisplay" class="flex text-yellow-400 space-x-1 text-sm">
                            <span class="text-gray-600">None</span>
                        </div>
                    </div>
                    <div class="flex justify-between items-center text-sm">
                        <span class="text-gray-400">Total Fine:</span>
                        <span id="totalFineDisplay" class="font-mono text-emerald-400 font-bold text-base">$0</span>
                    </div>
                </div>

                <!-- Action Button: Copy Summary -->
                <button id="copySummaryBtn" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2.5 rounded-lg text-sm flex items-center justify-center space-x-2 transition shadow-lg">
                    <i class="fa-regular fa-copy"></i>
                    <span>Copy Arrest Report Summary</span>
                </button>
            </div>

        </section>

    </main>

            { "code": "PC 3.9.2", "crime": "Breach of electoral silence at the voting booth", "stars": 4, "fine": 50000, "notes": "None", "desc": "Campaigning near the voting booth.", "art": "ART3" },
            { "code": "PC 3.9.3", "crime": "Blocking a voting site", "stars": 4, "fine": 35000, "notes": "None", "desc": "Intentionally blocking or limiting access to the voting booths.", "art": "ART3" },
            { "code": "PC 3.9.4", "crime": "Illegal persuation of votes", "stars": 4, "fine": 35000, "notes": "None", "desc": "Trying to get people to vote for someone in exchange of something.", "art": "ART3" },
            { "code": "PC 3.10", "crime": "Battery of a public servant", "stars": 3, "fine": 15000, "notes": "None", "desc": "Inflicting bodily injury without firearms on a state employee.", "art": "ART3" },
            { "code": "PC 3.11", "crime": "Murder or Attempted murder of a public servant", "stars": 5, "fine": 35000, "notes": "None", "desc": "Killing or trying to kill a public servant.", "art": "ART3" },
            { "code": "PC 3.12", "crime": "False reporting", "stars": 3, "fine": 20000, "notes": "None", "desc": "Alerting the authorities knowing details are incorrect.", "art": "ART3" },
            { "code": "PC 3.13.1", "crime": "Active Bribery", "stars": 3, "fine": 20000, "notes": "None", "desc": "Offering money or a favour to a person of trust.", "art": "ART3" },
            { "code": "PC 3.13.2", "crime": "Passive Bribery", "stars": 5, "fine": 50000, "notes": "None", "desc": "Taking money or a favour given or promised in order to influence the judgement or conduct of a person in a position of trust.", "art": "ART3" },
            { "code": "PC 3.13.3", "crime": "Quid Pro Quo", "stars": 5, "fine": 50000, "notes": "None", "desc": "A favour or advantage given in return for something", "art": "ART3" },
            { "code": "PC 3.14", "crime": "Failure to pay fines", "stars": 3, "fine": 20000, "notes": "No Bail until sum has been paid", "desc": "Being at max fines and not paying them.", "art": "ART3" },
            { "code": "PC 3.15.1", "crime": "Evading arrest", "stars": 3, "fine": 20000, "notes": "No Bail", "desc": "A person fleeing LEO trying to arrest, detaion or investigate them.", "art": "ART3" },
            { "code": "PC 3.15.2", "crime": "Assisting the evasion of arrest", "stars": 3, "fine": 20000, "notes": "No Bail", "desc": "Assisting a person evade an arrest.", "art": "ART3" },
            { "code": "PC 3.15.3", "crime": "Assisting the evasion of arrest by a public servant", "stars": 5, "fine": 75000, "notes": "No Bail", "desc": "Assisting a person evade an arrest by a public servant.", "art": "ART3" },
            { "code": "PC 3.16.1", "crime": "Street harassment towards a colleague", "stars": 2, "fine": 20000, "notes": "Dismissal from position", "desc": "Harassment toward a colleague.", "art": "ART3" },
            { "code": "PC 3.16.2", "crime": "Hostile work environment", "stars": 3, "fine": 50000, "notes": "Dismissal from position", "desc": "Behaviour that makes a work environment difficult or uncomfortable.", "art": "ART3" },
            { "code": "PC 3.16.3", "crime": "Sexual harassment towards a colleague", "stars": 3, "fine": 50000, "notes": "Dismissal from position", "desc": "Sexually harassing a colleague.", "art": "ART3" },
            { "code": "PC 3.17", "crime": "Going absent without leave", "stars": 5, "fine": 50000, "notes": "Dismisal from position", "desc": "Being absent from military duties without authority.", "art": "ART3" },
            { "code": "PC 3.18", "crime": "Provoking a public servant", "stars": 2, "fine": 20000, "notes": "None", "desc": "Provoking but to a public servant.", "art": "ART3" },
            { "code": "PC 3.19", "crime": "Tax Evasion", "stars": 4, "fine": 0, "notes": "Fine is detailed in the warrant up to a maximum of $100,000", "desc": "Avoiding taxes!", "art": "ART3" },
            { "code": "PC 3.20", "crime": "Participation in a cyber attack of the state’s resources", "stars": 4, "fine": 25000, "notes": "None", "desc": "Taking part in a hacker attack on the state's network.", "art": "ART3" },
            { "code": "PC 3.21", "crime": "Unfair Dismissal", "stars": 4, "fine": 0, "notes": "The prison sentence is subject to a court verdict or settlement agreement", "desc": "The act of dismissing an employee from an organization without first following correct protocols or without reason or sufficient evidence.", "art": "ART3" },
            { "code": "PC 4.1", "crime": "Disobeying an order", "stars": 3, "fine": 20000, "notes": "No Bail", "desc": "Refusing or failing to follow a lawful order given by a superior.", "art": "ART4" },
            { "code": "PC 4.2", "crime": "Professional Misconduct", "stars": 5, "fine": 75000, "notes": "None", "desc": "Conducting oneself in a manner that is professionally unsuitable, potentially dangerous, incompetent, distruptive, abusive or illegal.", "art": "ART4" },
            { "code": "PC 4.3", "crime": "Sabotage", "stars": 5, "fine": 75000, "notes": "None", "desc": "Destroying/damaging weapons, ammo, goods, items of state property to hinder or halt operations by the state.", "art": "ART4" },
            { "code": "PC 4.4", "crime": "Espionage", "stars": 5, "fine": 75000, "notes": "None", "desc": "Spying or watching a person, company, government etc.", "art": "ART4" },
            { "code": "PC 4.5", "crime": "Conduct Unbecoming", "stars": 5, "fine": 75000, "notes": "None", "desc": "Acting agaisnt the public interests which harms their statnding of the professionalism to the public eye.", "art": "ART4" },
            { "code": "PC 4.6", "crime": "Corruption", "stars": 5, "fine": 75000, "notes": "None", "desc": "Dishonest or fraudulent behaviour by a state employee.", "art": "ART4" },
            { "code": "PC 5.1", "crime": "Disobeying a judicial order", "stars": 4, "fine": 20000, "notes": "No Bail", "desc": "Refusing or failing to follow a lawful order given by the Governor, AG or Judge.", "art": "ART5" },
            { "code": "PC 5.2", "crime": "Disruption of a trial", "stars": 4, "fine": 20000, "notes": "No Bail", "desc": "Distrupting court or legal processes in court.", "art": "ART5" },
            { "code": "PC 5.3", "crime": "Dishonoring a judiciary member", "stars": 4, "fine": 20000, "notes": "No Bail", "desc": "Dishonoring the position of a judicial officer during the performance and/or in relation to previous performance.", "art": "ART5" },
            { "code": "PC 5.4", "crime": "Contempt of court", "stars": 4, "fine": 20000, "notes": "No Bail", "desc": "Being disobedient in court.", "art": "ART5" },
            { "code": "PC 5.5", "crime": "Ill-use of a judiciary permit", "stars": 4, "fine": 20000, "notes": "No Bail", "desc": "Misuse of a judicial permit.", "art": "ART5" },
            { "code": "PC 5.6", "crime": "Forged Evidence", "stars": 4, "fine": 20000, "notes": "No Bail", "desc": "Tampering or forging evidence.", "art": "ART5" },
            { "code": "PC 5.7", "crime": "Perjury", "stars": 4, "fine": 20000, "notes": "No Bail", "desc": "Swearing a false oath or falsifying an affirmation to tell the truth, whether spoken or in writing concerining official proceedings.", "art": "ART5" }
        ];

        let selectedCharges = [];
        let currentFilter = "ALL";
        let searchQuery = "";

        const lawListEl = document.getElementById('lawList');
        const searchInput = document.getElementById('searchInput');
        const filterBtns = document.querySelectorAll('.filter-btn');
        const selectedChargesList = document.getElementById('selectedChargesList');
        const totalFineDisplay = document.getElementById('totalFineDisplay');
        const totalStarsDisplay = document.getElementById('totalStarsDisplay');
        const chargeCount = document.getElementById('chargeCount');
        const clearAllBtn = document.getElementById('clearAllBtn');
        const copySummaryBtn = document.getElementById('copySummaryBtn');

        function renderStars(count) {
            let starsHtml = '';
            for (let i = 0; i < count; i++) {
                starsHtml += '<i class="fa-solid fa-star text-yellow-400"></i>';
            }
            return starsHtml || '<span class="text-gray-500 text-xs">No Stars</span>';
        }

        function renderLaws() {
            lawListEl.innerHTML = '';
            
            const filtered = penalData.filter(item => {
                const matchesCategory = (currentFilter === "ALL") || (item.art === currentFilter);
                const matchesSearch = item.code.toLowerCase().includes(searchQuery) ||
                                      item.crime.toLowerCase().includes(searchQuery) ||
                                      item.desc.toLowerCase().includes(searchQuery);
                return matchesCategory && matchesSearch;
            });

            if (filtered.length === 0) {
                lawListEl.innerHTML = `<p class="text-gray-400 text-center py-8 bg-leoCard rounded-xl border border-leoBorder">No penal codes found matching your criteria.</p>`;
                return;
            }

            filtered.forEach(item => {
                const isSelected = selectedCharges.some(c => c.code === item.code);
                
                const card = document.createElement('div');
                card.className = `bg-leoCard border ${isSelected ? 'border-blue-500 bg-blue-950/20' : 'border-leoBorder'} p-4 rounded-xl flex flex-col md:flex-row justify-between items-start md:items-center gap-4 hover:border-gray-600 transition`;
                
                card.innerHTML = `
                    <div class="flex-1 space-y-1">
                        <div class="flex items-center space-x-3">
                            <span class="bg-blue-900/60 text-blue-300 font-mono text-xs font-bold px-2 py-0.5 rounded border border-blue-700/50">${item.code}</span>
                            <h3 class="text-sm font-bold text-white">${item.crime}</h3>
                        </div>
                        <p class="text-xs text-gray-400">${item.desc}</p>
                        ${item.notes !== 'None' ? `<p class="text-xs text-amber-400 font-medium"><i class="fa-solid fa-triangle-exclamation mr-1"></i>Note: ${item.notes}</p>` : ''}
                    </div>
                    <div class="flex items-center justify-between md:justify-end w-full md:w-auto gap-4 border-t md:border-t-0 border-leoBorder pt-2 md:pt-0">
                        <div class="text-left md:text-right">
                            <div class="flex items-center space-x-1 text-xs mb-1">
                                ${renderStars(item.stars)}
                            </div>
                            <span class="font-mono text-emerald-400 font-semibold text-sm">$${item.fine.toLocaleString()}</span>
                        </div>
                        <button onclick="toggleCharge('${item.code}')" class="${isSelected ? 'bg-red-600 hover:bg-red-500' : 'bg-blue-600 hover:bg-blue-500'} text-white text-xs font-semibold px-3 py-1.5 rounded-lg transition flex items-center space-x-1">
                            <i class="fa-solid ${isSelected ? 'fa-minus' : 'fa-plus'}"></i>
                            <span>${isSelected ? 'Remove' : 'Add'}</span>
                        </button>
                    </div>
                `;
                lawListEl.appendChild(card);
            });
        }

        window.toggleCharge = function(code) {
            const index = selectedCharges.findIndex(c => c.code === code);
            if (index > -1) {
                selectedCharges.splice(index, 1);
            } else {
                const law = penalData.find(c => c.code === code);
                if (law) selectedCharges.push(law);
            }
            updateCalculator();
            renderLaws();
        };

        function updateCalculator() {
            chargeCount.textContent = selectedCharges.length;
            
            if (selectedCharges.length === 0) {
                selectedChargesList.innerHTML = `<p class="text-gray-500 italic text-center py-4">No charges added yet. Click "+ Add" on any crime to calculate total fine & wanted level.</p>`;
                totalFineDisplay.textContent = '$0';
                totalStarsDisplay.innerHTML = `<span class="text-gray-600">None</span>`;
                return;
            }

            let totalFine = 0;
            let maxStars = 0;
            selectedChargesList.innerHTML = '';

            selectedCharges.forEach(item => {
                totalFine += item.fine;
                if (item.stars > maxStars) maxStars = item.stars;

                const itemEl = document.createElement('div');
                itemEl.className = 'flex justify-between items-center bg-gray-900 border border-leoBorder p-2 rounded';
                itemEl.innerHTML = `
                    <div class="truncate mr-2">
                        <span class="font-mono text-blue-400 font-bold">${item.code}</span>
                        <span class="text-gray-300 ml-1">${item.crime}</span>
                    </div>
                    <button onclick="toggleCharge('${item.code}')" class="text-red-400 hover:text-red-300 px-1">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                `;
                selectedChargesList.appendChild(itemEl);
            });

            totalFineDisplay.textContent = `$${totalFine.toLocaleString()}`;
            totalStarsDisplay.innerHTML = renderStars(maxStars);
        }

        searchInput.addEventListener('input', (e) => {
            searchQuery = e.target.value.toLowerCase();
            renderLaws();
        });

        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                filterBtns.forEach(b => b.classList.remove('active', 'bg-blue-600', 'text-white'));
                filterBtns.forEach(b => b.classList.add('bg-gray-800', 'text-gray-300'));
                
                btn.classList.add('active', 'bg-blue-600', 'text-white');
                btn.classList.remove('bg-gray-800', 'text-gray-300');
                
                currentFilter = btn.getAttribute('data-art');
                renderLaws();
            });
        });

        clearAllBtn.addEventListener('click', () => {
            selectedCharges = [];
            updateCalculator();
            renderLaws();
        });

        copySummaryBtn.addEventListener('click', () => {
            if (selectedCharges.length === 0) {
                alert('Please select at least one charge first.');
                return;
            }

            let totalFine = selectedCharges.reduce((sum, item) => sum + item.fine, 0);
            let maxStars = Math.max(...selectedCharges.map(item => item.stars));
            
            let summary = `*** LEO ARREST REPORT SUMMARY ***\n`;
            summary += `Charges (${selectedCharges.length}):\n`;
            selectedCharges.forEach(item => {
                summary += `- ${item.code}: ${item.crime} ($${item.fine.toLocaleString()})\n`;
            });
            summary += `\nTotal Fine: $${totalFine.toLocaleString()}\n`;
            summary += `Wanted Level: ${maxStars} Star(s)\n`;

            navigator.clipboard.writeText(summary).then(() => {
                alert('Arrest report summary copied to clipboard!');
            });
        });

        // Initial Render
        renderLaws();
    </script>
</body>
</html>
